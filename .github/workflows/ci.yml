name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@10.11.0)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Consumers resolve @betterpay/core via package exports → dist/
      - name: Build core (refresh dist types)
        run: pnpm --filter @betterpay/core build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run
