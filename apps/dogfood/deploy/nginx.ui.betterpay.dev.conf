# ui.betterpay.dev — BetterPay UI docs + component registry
# Proxies to Cloudflare Pages (betterpay-ui.pages.dev) while DNS A stays on this host.

server {
    listen 80;
    listen [::]:80;
    server_name ui.betterpay.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ui.betterpay.dev;

    ssl_certificate     /etc/letsencrypt/live/ui.betterpay.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.betterpay.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8M;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # CORS for shadcn registry fetches
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        proxy_pass         https://betterpay-ui.pages.dev;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host              betterpay-ui.pages.dev;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Prefer origin host in redirects if CF sends absolute Location
        proxy_redirect https://betterpay-ui.pages.dev/ https://ui.betterpay.dev/;
        proxy_redirect http://betterpay-ui.pages.dev/ https://ui.betterpay.dev/;
    }
}
